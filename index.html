
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model — Навчальні картки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>CSS Box Model</h1>
        <p class="subtitle">Демонстрація розмірів, відступів та позиціювання</p>

        <section class="card card-one">
            <span class="badge">Нове</span>
            <h2>Перша картка</h2>
            <p>
                Ця картка демонструє роботу padding,
                border та margin.
            </p>
        </section>

        <section class="card card-two">
            <h2>Друга картка</h2>
            <p>
                Тут використовується інша комбінація
                внутрішніх і зовнішніх відступів.
            </p>
        </section>

    </main>

</body>
</html>
